<!doctype html>
<!--
  Dev-only siege lab for /odysseyVS. Same trick as scene-lab.html: swap rAF
  for a manual queue, report the document visible, pump deterministic frames
  through the REAL war engine, then freeze the last frame into an <img> —
  hidden-pane compositors drop live canvas layers but still paint DOM images.

  Open at: /vs-lab.html?seconds=40&roster=eth,base,arbitrum,hyperevm
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Siege Lab</title>
    <style>
      body { margin: 0; padding: 16px; background: #0b0718; color: #f4f1ff;
             font: 12px/1.5 ui-monospace, "JetBrains Mono", monospace; }
      h1 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 10px; }
      #status { color: #a78bfa; margin-bottom: 10px; white-space: pre; }
      img, canvas { display: block; width: 100%; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <h1>Siege Lab — the plain of Ilion</h1>
    <div id="status">booting…</div>
    <img id="still" alt="final frame" />
    <canvas id="stage"></canvas>

    <script type="module">
      const params = new URLSearchParams(location.search)
      const SECONDS = Number(params.get('seconds') || 40)
      const ROSTER = (params.get('roster') || 'eth,base,arbitrum,hyperevm').split(',')
      const STEP_MS = 16

      let queued = null
      window.requestAnimationFrame = (cb) => { queued = cb; return 1 }
      window.cancelAnimationFrame = () => { queued = null }
      Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true })
      Object.defineProperty(document, 'hidden', { get: () => false, configurable: true })

      const { createWarEngine } = await import('/src/vs/warEngine.js')

      const canvas = document.getElementById('stage')
      canvas.style.height = '360px'
      Object.defineProperty(canvas, 'clientWidth', { get: () => 1280 })
      Object.defineProperty(canvas, 'clientHeight', { get: () => 360 })
      canvas.getBoundingClientRect = () => (
        { left: 0, top: 0, right: 1280, bottom: 360, width: 1280, height: 360 }
      )
      const engine = createWarEngine(canvas)
      engine.start()
      engine.setRoster(ROSTER)
      // Size the surface BEFORE stepping: gate/shore lines derive from the
      // buffer width, and stepping at the 720px default then presenting at
      // the real width would misplace the front in the still.
      { const cb = queued; queued = null; if (cb) cb(0); }

      // Hidden panes throttle setTimeout to ~1/s, so the pump is fully
      // synchronous: advance the sim with __step (no draws), interleaving
      // real-cadence Monad blocks, then fire the queued rAF callback once
      // for a single final paint.
      const CHUNK = 0.3
      for (let t = 0; t < SECONDS; t += CHUNK) {
        engine.pushMonadBlock({ number: 90_000_000 + Math.round(t / 0.3), gasLimit: 150_000_000 })
        engine.__step(CHUNK)
      }
      {
        const cb = queued
        queued = null
        if (cb) cb(SECONDS * 1000)
        engine.stop()
        const s = engine.snapshot()
        document.getElementById('still').src = canvas.toDataURL('image/png')
        document.getElementById('status').textContent =
          `done ${SECONDS}s | state=${s.state} front=${Math.round(s.frontPct * 100)}%\n` +
          `monad fielded=${s.monad.fielded} fallen=${s.monad.fallen} blocks=${s.monad.blocks}\n` +
          `troy fielded=${s.troy.fielded} fallen=${s.troy.fallen} gas/s=${s.troy.gasPerSecM}M\n` +
          s.troy.chains.map((c) => `  ${c.tag} ${c.gasPerSecM}M/s fielded=${c.fielded} fallen=${c.fallen} blocks=${c.blocks}`).join('\n')
        document.title = 'Siege Lab — done'
      }
    </script>
  </body>
</html>
